[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scmarkeragent"
version = "0.1.0"
description = "Evidence-grounded single-cell cluster annotation with Python and R arms"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "PolyForm-Noncommercial-1.0.0"
authors = [
  {name = "Haoran Chen", email = "chenhaoran@stu.njmu.edu.cn"},
  {name = "Chen Cao", email = "caochen@njmu.edu.cn"}
]
keywords = ["single-cell", "cell-type annotation", "marker evidence", "transcriptomics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics"
]
dependencies = [
  "scanpy==1.12.1",
  "anndata==0.12.5",
  "scikit-learn==1.9.0",
  "scikit-misc==0.5.2",
  "scipy==1.16.3",
  "numpy==2.4.4",
  "pandas==2.3.3",
  "requests==2.33.1",
  "python-igraph==1.0.0",
  "leidenalg==0.12.0",
  "matplotlib==3.10.8",
  "umap-learn==0.5.12"
]

[project.urls]
Homepage = "https://github.com/HaoRan-Code/scMarkerAgent"
Repository = "https://github.com/HaoRan-Code/scMarkerAgent"
"Bug Tracker" = "https://github.com/HaoRan-Code/scMarkerAgent/issues"
Archive = "https://doi.org/10.5281/zenodo.22333283"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
scmarkeragent = "scmarkeragent.cli:main"
scmarkeragent-r = "scmarkeragent.r_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scmarkeragent = [
  "config/*.json",
  "schemas/*.json",
  "prompts/*.txt",
  "resources/resource_index.json",
  "resources/static/ontology/*.obo",
  "resources/static/ortholog/*.csv",
  "resources/static/viewer/*",
  "rflow/*.R"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
